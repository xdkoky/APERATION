    let markOk=false;try{if(markImg.complete&&markImg.naturalWidth){mc.getContext("2d").drawImage(markImg,-(545-493)*ux*K,0,792*ux*K,477*uy*K);markOk=true}}catch(e){}

    const st=performance.now(),D=1100,ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;

      const kx=mc.width/dw,ky=mc.height/dh;rx.drawImage(mc,(x0-dx)*kx,(y0-dy)*ky,(x1-x0)*kx,(y1-y0)*ky,x0,y0,x1-x0,y1-y0)};

function project(){
  const t=tod(),P=[];let x;if(!B.length)return{P,wrap:t,t};
  if(!st.cur){x=live()?Math.max(t,B[0].s):B[0].s;
    for(const b of B){if(st.skip[b.i]){P[b.i]={skip:1};continue}P[b.i]={s:x,e:x+dEff(b)};x+=dEff(b)}
    return{P,wrap:x,t}}
  x=null;
  for(const b of B){
    if(st.act[b.i]){P[b.i]={...st.act[b.i],done:1};continue}
    if(st.skip[b.i]){P[b.i]={skip:1};continue}
    if(b.i===st.cur.i){const s=st.cur.at,e=Math.max(t,s+dEff(b));P[b.i]={s,e,cur:1};x=e;continue}
    if(b.i>st.cur.i){const s=x??t;P[b.i]={s,e:s+dEff(b)};x=s+dEff(b)}

}

}

  const{sw,sh,bw,bh}=vBase();V.z=Math.min(vMax(),Math.max(1,V.z));const W=bw*V.z,H=bh*V.z;
  V.x=W<=sw?(sw-W)/2:Math.min(0,Math.max(sw-W,V.x));V.y=H<=sh?(sh-H)/2:Math.min(0,Math.max(sh-H,V.y));

}

  else if(V.ptrs.size===1){if(V.g)V.g.moved+=Math.abs(dx)+Math.abs(dy);if(V.z>1.001){V.x+=dx;V.y+=dy;vApply()}}
});
function vUp(e){
  if(!V.ptrs.has(e.pointerId))return;V.ptrs.delete(e.pointerId);
  if(V.ptrs.size<2)V.pin=null;if(V.ptrs.size)return;vStage.classList.remove("drag");
  const g=V.g;V.g=null;if(!g||g.multi||e.type==="pointercancel")return;
  const dx=e.clientX-g.sx,dy=e.clientY-g.sy,dt=Date.now()-g.t;
  if(g.moved<10&&dt<320){ // koppintás: a második gyors koppintás nagyít vagy visszaáll
    if(V.tap&&Date.now()-V.tap.t<340&&Math.hypot(e.clientX-V.tap.x,e.clientY-V.tap.y)<40){V.tap=null;if(V.z>1.05){V.z=1;vApply()}else vZoomAt(e.clientX,e.clientY,Math.min(vMax(),3))}
    else V.tap={t:Date.now(),x:e.clientX,y:e.clientY};return}
  if(V.z<=1.001&&dt<600){if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4)vStep(dx<0?1:-1);else if(dy>110&&dy>Math.abs(dx)*1.4)closeViewer()}
}

  // gyűrű + kivetítő

let openRow=null;
function renderTimeline(){
  const v=$('[data-view="idorend"]'),{P,wrap}=project(),wr=Math.round(wrap),s=statusOf(wrap);
  const shTot=B.filter(x=>x.type==="shoot"&&!st.skip[x.i]).length,shDone=B.filter(x=>x.type==="shoot"&&st.act[x.i]).length;
  const rows=B.map(b=>{
    const p=P[b.i]||{},cls=p.done?"done":p.cur?"cur":p.skip?"skip":"",open=openRow===b.i;
    const main=p.skip?hm(b.s):hm(p.s),planDiff=!p.skip&&Math.abs(p.s-b.s)>=1;
    let end="";
    if(p.skip)end="kihagyva";else if(p.done){const dd=(p.e-p.s)-b.d;end=`<span class="drift ${driftCls(dd)}">${Math.abs(dd)>=1?signMin(dd):ic("check",16)}</span>`}
    else if(p.cur)end=`<span class="nowtag">MOST</span>`;else{const dr=p.s-b.s;end=Math.abs(dr)>=1?`<span class="drift ${driftCls(dr)}">${signMin(dr)}</span>`:""}
    return`<div class="tl-row ${cls}" data-type="${b.type}" data-row="${b.i}"><div class="tl-time"><b>${main}</b>${planDiff?`<span>terv ${hm(b.s)}</span>`:""}</div><div class="tl-rail"><i></i></div>
      <div class="tl-body">${(()=>{const sh=D.shots[b.label];return sh&&sh.sb.length?`<span class="tl-sb" data-gallery>${sh.sb.map(x=>sbThumb(x)).join("")}</span>`:""})()}<b>${esc(b.label)}</b><div class="sub">${esc(TNAME[b.type])} · ${dEff(b)}′${b.setup?" · "+esc(b.setup):""}${takeSum(b.i)}</div>
      ${open?`${b.note?`<p class="muted small" style="margin-top:8px">${esc(b.note)}</p>`:""}${b.type==="shoot"&&(st.takes[b.i]||[]).length?`<div class="tl-tk"><span class="cap">Take-ek</span>${takeList(b.i)}</div>`:""}<div class="tl-x">${p.cur?"":`<button class="btn sm solid" type="button" data-jump="${b.i}">${ic("play",14)}Ez megy most</button><button class="btn sm" type="button" data-skip="${b.i}">${ic("skip",14)}${p.skip?"Visszavétel":"Kihagyás"}</button>`}${p.cur?`<a class="btn sm" href="#most">Vissza a Most nézethez</a>`:""}</div>`:""}</div>
      <div class="tl-end">${end}</div></div>`}).join("");
  v.innerHTML=`<div class="vh">Időrend</div><div class="stats"><div class="stat"><span class="cap">Shot</span><b>${shDone}/${shTot}</b></div><div class="stat"><span class="cap">Várható wrap</span><b style="color:var(--${s})">${hm(wrap)}</b></div><div class="stat"><span class="cap">Tervhez</span><b>${signMin(wr-PLAN_WRAP)}</b></div></div>
    <section class="card" style="padding:8px 6px"><div class="tl">${rows}<div class="tl-row last" data-type="pres"><div class="tl-time"><b>${hm(wrap)}</b>${wr!==PLAN_WRAP?`<span>terv ${hm(PLAN_WRAP)}</span>`:""}</div><div class="tl-rail"><i></i></div><div class="tl-body"><b>Wrap</b><div class="sub">Bontás, pakolás, napi riport</div></div><div class="tl-end"></div></div></div></section>
    <p class="muted small" style="margin-top:10px;text-align:center">Koppints egy sorra: ugrás oda vagy kihagyás.</p>`;
  bindTakes(v,renderTimeline);
  v.querySelectorAll("[data-row]").forEach(r=>r.onclick=e=>{if(e.target.closest("button,a,input,.tl-tk"))return;const i=+r.dataset.row;openRow=openRow===i?null:i;renderTimeline();

  v.querySelectorAll("[data-skip]").forEach(x=>x.onclick=()=>{openRow=null;toggleSkip(+x.dataset.skip)});

  clearTimeout(pushT);pushT=setTimeout(()=>{const ts=Date.now();MP.lastPush=MP.liveTs=ts;
    const x={};LIVEKEYS.forEach(k=>x[k]=st[k]);pref().collection("live").doc("state").set({s:JSON.stringify(x),ts,by:UID}).catch(mpErr)},200);
}
function mpOnLive(s){
  if(!s.exists)return;const d=s.data();if(d.ts<=MP.liveTs)return;
  if(tour){MP.pendLive=s;return}
  MP.liveTs=d.ts;let x;try{x=JSON.parse(d.s)}catch(e){return}
  LIVEKEYS.forEach(k=>{st[k]=x[k]??fresh()[k]});
  mpApplying=true;save();mpApplying=false;lastHero=null;
  if(document.activeElement&&document.activeElement.matches(".tk-note")){takesHold=true;tick(true)}
  else if(view==="terv"&&document.activeElement&&document.activeElement.closest('[data-view="terv"]'))tick(true);else renderAll();
}
/* take-ek külön dokumentumban (live/takes), blokkonként összefésülve, hogy a szkriptes és az AD ne írja felül egymást */
let takesT=null,takesDirty=new Set(),takesAll=false;
function mpPushTakes(keys){
  if(!MP.on||!MP.ready||mpApplying||tour||st.sim.on||!canTake())return;
  if(keys==null)takesAll=true;else[].concat(keys).forEach(k=>takesDirty.add(String(k)));
  clearTimeout(takesT);takesT=setTimeout(()=>{const ts=Date.now();MP.takesTs=ts;const t={};
    const ks=takesAll?Object.keys(st.takes):[...takesDirty];ks.forEach(k=>t[k]=JSON.stringify(st.takes[k]||[]));
    const all=takesAll;takesAll=false;takesDirty.clear();
    pref().collection("live").doc("takes").set({t,sw:st.sw?JSON.stringify(st.sw):"",ts,by:UID},all?{}:{merge:true}).catch(mpErr)},200);
}
let takesHold=false;
function mpOnTakes(s){
  if(!s.exists)return;const d=s.data();if(d.by===UID&&d.ts<=(MP.takesTs||0))return;
  if(tour){MP.pendTakes=s;return}
  const t={};for(const k in d.t||{}){try{const a=JSON.parse(d.t[k]);if(a&&a.length)t[k]=a}catch(e){}}
  st.takes=t;try{st.sw=d.sw?JSON.parse(d.sw):null}catch(e){st.sw=null}
  mpApplying=true;save();mpApplying=false;
  // jegyzetírás közben nem rajzolunk újra (elveszne a fókusz); a mező elhagyásakor frissül
  if(document.activeElement&&document.activeElement.matches(".tk-note")){takesHold=true;return}
  takesRedraw();
}
function takesRedraw(){takesHold=false;if(!B.length)return;if(view==="most")renderMost();else if(view==="idorend")renderTimeline()}
function mpOnView(s){
  if(!s.exists){if(isMember())mpLost();return}
  const d=s.data();
  if(isMpAdmin()&&d.by===UID&&d.ts<=MP.lastPub)return;
  if(tour){MP.pendView=s;return}
  let p;try{p=JSON.parse(d.plan)}catch(e){return}
  if(isMpAdmin()){
    const remote=normP(p);MP.title=remote.title;mpSaveLocal();
    if(MP.base&&jeq(remote,MP.base))return;
    // ha nálunk van még el nem küldött változás, összefésüljük, és visszaküldjük
    const local=MP.base&&!jeq(P,MP.base)?normP(merge3(MP.base,P,remote)):remote;
    setBase(remote);if(!jeq(local,P))mpApplyPlan(local);if(!jeq(local,remote))mpPublishSoon();
    mpFetchImgs();return;
  }
  if(isMember()){MP.perm=d.perm;MP.roleName=d.roleName}
  MP.title=p.title;mpSaveLocal();
  mpApplying=true;P=normP(p);saveP();applyProject();mpApplying=false;mpFetchImgs();
  tabKey="";if(view==="terv"&&document.activeElement&&document.activeElement.closest('[data-view="terv"]'))tick(true);else renderAll();
}
function mpFlush(){const v=MP.pendView,l=MP.pendLive,tk=MP.pendTakes;MP.pendView=MP.pendLive=MP.pendTakes=null;if(v)mpOnView(v);if(l)mpOnLive(l);if(tk)mpOnTakes(tk)}
let unsubs=[];
function mpStop(){presLeave();unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];MP.ready=false;MP.pres=[];presPaint()}
function mpListen(){
  mpStop();const r0=pref(),vid=isMpAdmin()?"__admin":MP.roleId;
  unsubs.push(r0.collection("views").doc(vid).onSnapshot(mpOnView,e=>e.code==="permission-denied"&&isMember()?mpLost():mpErr(e)));
  unsubs.push(r0.collection("live").doc("state").onSnapshot(mpOnLive,e=>e.code==="permission-denied"&&isMember()?mpLost():mpErr(e)));
  // jelenlét: ki melyik részen, melyik blokkon/mezőn dolgozik (csak a szerkesztők látják egymást)
  if(isMpAdmin()){unsubs.push(r0.collection("presence").onSnapshot(q=>{MP.pres=q.docs.filter(d=>d.id!==UID).map(d=>({uid:d.id,...d.data()}));presPaint()},e=>{if(e.code!=="permission-denied")mpErr(e)}));setTimeout(()=>presTouch(true),300)}
  // képek: ha valaki feltölt egyet, a kis „imgmeta” dokumentum jelzi, és letöltjük
  unsubs.push(r0.collection("imgmeta").onSnapshot(()=>mpFetchImgs(),e=>{if(e.code!=="permission-denied")mpErr(e)}));
  unsubs.push(r0.collection("live").doc("takes").onSnapshot(mpOnTakes,e=>e.code==="permission-denied"&&isMember()?mpLost():mpErr(e)));
  // ha a szerkesztő kitilt, a saját tagsági dokumentum eltűnik
  if(MP.roleId!=="__owner")unsubs.push(r0.collection("members").doc(UID).onSnapshot(s=>{if(!s.exists&&!s.metadata.hasPendingWrites&&!s.metadata.fromCache)mpLost()},e=>{if(e.code==="permission-denied")mpLost()}));
  if(isMpAdmin()){
    unsubs.push(r0.collection("roles").onSnapshot(q=>{
      MP.roles=q.docs.filter(d=>d.id!=="__admin").map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
      const a=q.docs.find(d=>d.id==="__admin");MP.adminCode=a?a.data().code:"";
      // régebbi projektek: a szkriptes és a 2nd AD megkapja a take-naplót
      MP.roles.forEach(r=>{if(r.perm&&r.perm.takes===undefined){r.perm.takes=/szkript|1st ad|2nd ad/i.test(r.name||"");mpRoleSave(r)}});
      mpTeamRefresh()},mpErr));
    unsubs.push(r0.collection("members").onSnapshot(q=>{MP.members=q.docs.map(d=>({uid:d.id,...d.data()}));mpTeamRefresh()},mpErr));
  }
  MP.ready=true;
}
function mpTeamRefresh(){if(view==="terv"&&editSec==="csapat"&&!(document.activeElement&&document.activeElement.closest(".team")))renderEdit()}
function mpLost(){if(!MP.on||MP.leaving)return;MP.leaving=true;toast("Kikerültél a közös projektből: a szerkesztő törölte a pozíciódat vagy kitiltott.",{tone:"late",ms:8000});mpLeave(true)}

/* létrehozás, belépés, kilépés */
async function mpCreate(btn){
  if(btn){btn.disabled=true;btn.textContent="Létrehozás…"}
  try{
    await fbInit();const pid=RID(20),r0=fdb.collection("projects").doc(pid),ts=Date.now();
    await r0.set({owner:UID,title:P.title||"",created:ts,ts});
    const b=fdb.batch(),acode=RAND(8);
    const myname=(($("#myname")||{}).value||MP.name||"").trim();
    MP={...MP,base:null,on:true,mode:"admin",pid,roleId:"__owner",code:acode,name:myname,perm:ALLPERM,roleName:"Szerkesztő",title:P.title,roles:[],members:[]};
    let tpl=null;try{tpl=JSON.parse(localStorage.getItem("aperation-team-tpl")||"null")}catch(e){}
    const list=Array.isArray(tpl)&&tpl.length?tpl.map(r=>[r.name,Object.assign(permOf(""),r.perm||{})]):PRESETS.map(([n,s])=>[n,permOf(s)]);
    try{localStorage.removeItem("aperation-team-tpl")}catch(e){}
    list.forEach(([name,perm],k)=>{const id=RID(12),code=RAND(8);MP.roles.push({id,name,perm,code,order:k});
      b.set(r0.collection("roles").doc(id),{name,perm,code,order:k});b.set(fdb.collection("codes").doc(code),{pid,roleId:id})});
    b.set(r0.collection("roles").doc("__admin"),{name:"Szerkesztő (társ-AD)",admin:true,code:acode,order:-1});b.set(fdb.collection("codes").doc(acode),{pid,roleId:"__admin"});
    await b.commit();MP.adminCode=acode;mpSaveLocal();mpListen();await mpPublish();mpPush();mpPushTakes(null);myProjRec();
    toast("Közös projekt kész. Oszd ki a kódokat a stábnak.",{tone:"ok"});
  }catch(e){mpErr(e);MP.on=false;mpSaveLocal()}
  renderAll();
}
async function mpJoin(raw,name){
  const c=normCode(raw);if(c.length!==8){toast("A kód 8 karakter, pl. ABCD-2345.");return false}
  if(!name.trim()){toast("Írd be a neved, hogy a szerkesztő lássa, ki csatlakozott.");return false}
  try{
    await fbInit();const cd=await fdb.collection("codes").doc(c).get();
    if(!cd.exists){toast("Nincs ilyen kód. Ellenőrizd, vagy kérj újat a szerkesztőtől.",{tone:"late"});return false}
    const {pid,roleId}=cd.data();
    // társszerkesztőnek fiók kell; stábpozícióra fiók nélkül is lehet csatlakozni
    if(roleId==="__admin"&&AUTH_REQ&&!accLoad()){try{localStorage.setItem(JOINKEY,c);localStorage.setItem(JOINNAME,name.trim())}catch(e){}
      authForce="Ez társszerkesztői meghívó: a diszpó szerkesztéséhez előbb lépj be, vagy hozz létre fiókot. Utána automatikusan csatlakozol.";authMode=accLoad()?"in":"reg";authShow(true);return false}
    await fdb.collection("projects").doc(pid).collection("members").doc(UID).set({code:c,roleId,name:name.trim(),joined:Date.now()});
    if(!MP.on){try{localStorage.setItem(LOCALP,JSON.stringify(P));localStorage.setItem(LOCALS,JSON.stringify(st))}catch(e){}}
    MP={...MP,base:null,on:true,mode:roleId==="__admin"?"admin":"member",pid,roleId,code:c,name:name.trim(),perm:roleId==="__admin"?ALLPERM:null,roleName:"",title:"",roles:[],members:[],lastPub:0,liveTs:0};
    if(isMember()){P=normP({});applyProject()}
    const s=st.sound;st=fresh();st.sound=s;mpApplying=true;save();mpApplying=false;
    try{localStorage.removeItem(JOINKEY)}catch(e){}
    myProjRec();
    mpSaveLocal();mpListen();if(isMpAdmin()){editSec="projekt";location.hash="#terv"}else location.hash="#most";renderAll();
    toast(isMember()?"Csatlakoztál. A terv mindjárt megjelenik.":"Csatlakoztál társszerkesztőként: együtt írjátok a diszpót.",{tone:"ok"});return true;
  }catch(e){mpErr(e);return false}
}
async function mpLeave(silent){
  if(PV){pvStop();return}
  const was={...MP};mpStop();
  if(was.mode==="member"&&fdb&&UID&&!silent){try{await fdb.collection("projects").doc(was.pid).collection("members").doc(UID).delete()}catch(e){}}
  if(!silent&&was.mode==="member"&&fdb&&UID&&was.pid){fdb.collection("users").doc(UID).collection("projects").doc(was.pid).delete().catch(()=>{})}
  MP={on:false,ready:false,roles:[],members:[],lastPub:0,lastPush:0,liveTs:0,leaving:false};mpSaveLocal();
  if(was.mode!=="admin"||was.roleId!=="__owner"){
    let p=null,s=null;try{p=JSON.parse(localStorage.getItem(LOCALP)||"null");s=JSON.parse(localStorage.getItem(LOCALS)||"null")}catch(e){}
    P=normP(p||{});saveP();applyProject();st=Object.assign(fresh(),s||{});save();
    try{localStorage.removeItem(LOCALP);localStorage.removeItem(LOCALS)}catch(e){}
  }
  tabKey="";location.hash="#most";renderAll();if(!silent)toast("Kiléptél a közös projektből.");
}
async function mpDeleteProject(){
  try{const r0=pref();
    for(const sub of ["presence","views","roles","members","live","imgmeta","imgdata"]){const q=await r0.collection(sub).get();for(const d of q.docs){if(sub==="roles"&&d.data().code){try{await fdb.collection("codes").doc(d.data().code).delete()}catch(e){}}await d.ref.delete()}}
    await r0.delete();
    fdb.collection("users").doc(UID).collection("projects").doc(MP.pid).delete().catch(()=>{});
  }catch(e){mpErr(e);return}
  MP.roleId="__owner";await mpLeave(true);toast("A közös projekt törölve. A terv megmaradt ezen az eszközön.",{tone:"ok"});
}

async function mpRoleSave(r){try{await pref().collection("roles").doc(r.id).set({name:r.name,perm:r.perm,code:r.code,order:r.order||0});mpPublishSoon()}catch(e){mpErr(e)}}
async function mpRoleAdd(){const code=RAND(8),id=RID(12),r={id,name:"Új pozíció",perm:permOf("most idorend"),code,order:(MP.roles.length?Math.max(...MP.roles.map(x=>x.order||0)):0)+1};
  try{await fdb.collection("codes").doc(code).set({pid:MP.pid,roleId:id});MP.roles.push(r);await mpRoleSave(r);renderEdit()}catch(e){mpErr(e)}}

  try{await fdb.collection("codes").doc(code).set({pid:MP.pid,roleId:r.id});await fdb.collection("codes").doc(old).delete();r.code=code;await mpRoleSave(r);renderEdit();toast("Új kód: "+fmtCode(code)+". A régi kóddal már nem lehet belépni; aki bent van, bent marad.")}catch(e){mpErr(e)}}
async function mpAdminNewCode(){const code=RAND(8),old=MP.adminCode;
  try{await fdb.collection("codes").doc(code).set({pid:MP.pid,roleId:"__admin"});if(old)await fdb.collection("codes").doc(old).delete();await pref().collection("roles").doc("__admin").set({name:"Szerkesztő (társ-AD)",admin:true,code,order:-1});MP.adminCode=code;renderEdit()}catch(e){mpErr(e)}}
async function mpRoleDel(r){
  try{const r0=pref();await fdb.collection("codes").doc(r.code).delete();await r0.collection("views").doc(r.id).delete();await r0.collection("roles").doc(r.id).delete();
    for(const m of MP.members.filter(m=>m.roleId===r.id))await r0.collection("members").doc(m.uid).delete();
    MP.roles=MP.roles.filter(x=>x!==r);renderEdit()}catch(e){mpErr(e)}}

document.addEventListener("click",async e=>{
  const t=e.target.closest("button,a");if(!t)return;const d=t.dataset;
  if(d.secGo){editSec=d.secGo;return}
  if(d.copy){copyText(fmtCode(d.copy));return}
  if(d.invite){mpInvite(d.invite,d.irole||"");return}
  if(d.kick){if(sure(t,"Biztos?"))mpKick(d.kick);return}
  if(d.perm){const r=MP.roles.find(x=>x.id===t.closest("[data-rid]").dataset.rid);if(!r)return;r.perm[d.perm]=!r.perm[d.perm];t.classList.toggle("on",r.perm[d.perm]);t.setAttribute("aria-pressed",r.perm[d.perm]);mpRoleSave(r);return}
  if(!d.do)return;
  const r=t.closest("[data-rid]")&&MP.roles.find(x=>x.id===t.closest("[data-rid]").dataset.rid);
  if(d.do==="mpcreate")mpCreate(t);
  else if(d.do==="join"){const box=t.closest(".join");t.disabled=true;const ok=await mpJoin(box.querySelector("#jcode").value,box.querySelector("#jname").value);t.disabled=false}
  else if(d.do==="joinform"){const f=$("#joinbox");if(f){f.hidden=!f.hidden;f.hidden||f.querySelector("#jcode").focus()}}
  else if(d.do==="mpleave"){if(sure(t,"Biztos? Koppints újra"))mpLeave(false)}
  else if(d.do==="mpdelete"){if(sure(t,"Biztos? Koppints újra"))mpDeleteProject()}
  else if(d.do==="roleadd")mpRoleAdd();
  else if(d.do==="admincode"){if(sure(t,"Biztos?"))mpAdminNewCode()}
  else if(d.do==="rolecode"&&r){if(sure(t,"Biztos?"))mpRoleNewCode(r)}
  else if(d.do==="roledel"&&r){if(sure(t,"Biztos? Törlöd"))mpRoleDel(r)}
});
document.addEventListener("change",e=>{const el=e.target;if(!el.matches||!el.matches("[data-rname]"))return;const r=MP.roles.find(x=>x.id===el.closest("[data-rid]").dataset.rid);if(r){r.name=el.value.trim()||"Pozíció";mpRoleSave(r)}});
document.addEventListener("input",e=>{const el=e.target;if(el.id==="jcode"){const c=normCode(el.value).slice(0,8);const v=c.length>4?c.slice(0,4)+"-"+c.slice(4):c;if(el.value!==v)el.value=v}});

/* ---------- szerepek kipróbálása (egyedül, egy eszközön) ----------
   A szerkesztő megnézheti, mit lát és mit tehet egy pozíció. A terv a szerepre szűrve jelenik meg,
   közben semmi nem mentődik és nem szinkronizál; kilépéskor minden visszaáll. */
let PV=null;
function pvRoles(){if(PV&&PV.roles)return PV.roles;return isMpAdmin()&&MP.roles.length?MP.roles.map(r=>({name:r.name,perm:r.perm})):PRESETS.map(([name,s])=>({name,perm:permOf(s)}))}
function pvHTML(){
  if(!P.blocks.length||isMember())return"";
  const rs=pvRoles();
  return`<section class="card" id="pvcard"><h2>Szerepek kipróbálása</h2>
    <p class="muted small">Nézd meg egyedül, mit lát és mit csinálhat egy pozíció a telefonján (pl. a szkriptes mérheti és csillagozhatja a take-eket, az általános stáb csak a napot és a stáblistát látja). Próba közben semmi nem mentődik és nem megy ki a stábnak; a kilépéskor minden visszaáll.</p>
    <div class="pvlist">${rs.map((r,i)=>`<button type="button" class="btn sm" data-pv="${i}">${ic("play",13)}${esc(r.name)}</button>`).join("")}</div></section>`;
}
function pvStart(i){
  const r=pvRoles()[i];if(!r)return;
  if(!PV){const roles=pvRoles();if(MP.on)mpStop();PV={P0:P,st0:JSON.stringify(st),MP0:MP,roles}}
  else{P=PV.P0;st=JSON.parse(PV.st0)}
  PV.name=r.name;PV.i=i;
  MP={...PV.MP0,on:true,mode:"member",perm:r.perm,roleName:r.name,ready:false,roles:[],members:[]};
  P=normP(filterP(PV.P0,r.perm));applyProject();
  st=Object.assign(fresh(),JSON.parse(PV.st0));
  // ha még nem indult a nap, egy forgatás közepére ugrunk, hogy minden kipróbálható legyen
  if(!st.cur){const sb=B.find(b=>b.type==="shoot")||B[0];if(sb){for(const b of B)if(b.i<sb.i)st.act[b.i]={s:b.s,e:b.e};st.sim={on:true,start:sb.s+6,speed:1,base:Date.now()};st.cur={i:sb.i,at:sb.s+1}}}
  lastHero=null;tabKey="";openRow=null;pvBar();location.hash="#most";renderAll();
}
function pvStop(){
  if(!PV)return;const x=PV;PV=null;
  MP=x.MP0;P=x.P0;st=JSON.parse(x.st0);applyProject();
  if(MP.on)mpListen();
  const b=$("#pvbar");b&&b.remove();document.body.classList.remove("pv");
  lastHero=null;tabKey="";openRow=null;editSec="csapat";location.hash="#terv";renderAll();
  toast("Kiléptél a próbából. Minden a régi.");
}
function pvBar(){
  let b=$("#pvbar");if(!b){b=document.createElement("div");b.id="pvbar";($(".hdr")||document.body).prepend(b);document.body.classList.add("pv")}
  const rs=pvRoles();
  b.innerHTML=`<span class="pv-l">${ic("users",15)}Szerepben:</span><select aria-label="Szerep">${rs.map((r,i)=>`<option value="${i}" ${i===PV.i?"selected":""}>${esc(r.name)}</option>`).join("")}</select><button type="button" class="btn sm solid" data-pvstop>Kilépés</button>`;
  b.querySelector("select").onchange=e=>pvStart(+e.target.value);
  b.querySelector("[data-pvstop]").onclick=pvStop;
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-pv]");if(t)pvStart(+t.dataset.pv)});

/* ---------- jelenlét (mint a Google Docsban) ----------
   Minden szerkesztő egy kis dokumentumot tart fenn (presence/{uid}): név, rész, blokk/shot, mező, időbélyeg.
   Csak akkor ír, ha máshova lép, illetve percenként egyszer életjelként; eltávozáskor törli. */
const PCOL=["#5ac8fa","#ff9f0a","#bf5af2","#30d158","#ff6482","#ffd60a","#64d2ff","#ac8e68"];
const pColor=u=>{let h=0;for(const c of String(u))h=(h*31+c.charCodeAt(0))>>>0;return PCOL[h%PCOL.length]};
const pInit=n=>String(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()||"?";
const PRES_SEC={projekt:"Projekt",shotlist:"Shotlist",idorend:"Időrend",emberek:"Emberek",szkript:"Forgatókönyv",csapat:"Csapat",fajl:"Fájl"};
const PRES_TTL=150000;
let presLast="",presT=null,presAt=0,presGone=false;
function presState(){
  const a=document.activeElement,inT=view==="terv";
  let id="",f="";
  if(inT&&a&&a.closest&&a.closest('[data-view="terv"]')){const h=a.closest("[data-id]");id=h?h.dataset.id:"";f=a.dataset&&a.dataset.f||""}
  if(inT&&!id)id=editSec==="shotlist"?(typeof openSL!=="undefined"&&openSL)||"":editSec==="idorend"?openEB||"":"";
  return{sec:inT?editSec:"",view,id,f};
}
function presTouch(force){
  if(!isMpAdmin()||!MP.ready||PV||tour||document.hidden||presGone)return;
  clearTimeout(presT);presT=setTimeout(()=>{const s=presState(),k=J(s);
    if(!force&&k===presLast&&Date.now()-presAt<60000)return;presLast=k;presAt=Date.now();
    pref().collection("presence").doc(UID).set({...s,name:MP.name||"Szerkesztő",ts:Date.now()}).catch(()=>{})},force?0:350);
}
function presLeave(){clearTimeout(presT);if(fdb&&UID&&MP.pid&&isMpAdmin()){presLast="";pref().collection("presence").doc(UID).delete().catch(()=>{})}}
function presLive(){return(MP.pres||[]).filter(p=>Date.now()-p.ts<PRES_TTL)}
function presPaint(){
  const live=MP.on&&isMpAdmin()?presLive():[];
  const bar=$("#presbar");
  if(bar)bar.innerHTML=live.map(p=>`<span class="pchip" style="--pc:${pColor(p.uid)}" title="${esc(p.name)} · ${esc(p.view==="terv"?PRES_SEC[p.sec]||"Terv":"nem a Terven")}">${esc(pInit(p.name))}</span>`).join("");
  document.querySelectorAll(".pdot").forEach(x=>x.remove());
  document.querySelectorAll(".pres-on").forEach(x=>{x.classList.remove("pres-on");x.style.removeProperty("--pc");x.removeAttribute("data-pres")});
  for(const p of live){if(p.view!=="terv")continue;const c=pColor(p.uid);
    const sb=document.querySelector(`[data-view="terv"] .esec [data-sec="${p.sec}"]`);
    if(sb){const d=document.createElement("i");d.className="pdot";d.style.setProperty("--pc",c);d.title=p.name;sb.append(d)}
    if(p.sec!==editSec)continue;
    const mark=el=>{if(!el)return;el.classList.add("pres-on");el.style.setProperty("--pc",c);el.setAttribute("data-pres",p.name+" szerkeszti")};
    let host=null;try{host=p.id?document.querySelector(`[data-view="terv"] [data-id="${CSS.escape(p.id)}"]`):null}catch(e){}
    if(host)mark(host);
    if(p.f){let fe=null;try{fe=host?host.querySelector(`[data-f="${CSS.escape(p.f)}"]`):[...document.querySelectorAll(`[data-view="terv"] [data-f="${CSS.escape(p.f)}"]`)].find(x=>!x.closest("[data-id]"))}catch(e){}
      if(fe){const w=fe.closest(".fi")||fe;if(w!==host)mark(w)}}
  }
  // Csapat: ki hol tart
  document.querySelectorAll("[data-presuid]").forEach(x=>{const p=live.find(q=>q.uid===x.dataset.presuid);x.textContent=p?(p.view==="terv"?"most: "+(PRES_SEC[p.sec]||"Terv"):"most: az appban"):""});
}
document.addEventListener("focusin",()=>presTouch());
document.addEventListener("focusout",()=>presTouch());
addEventListener("hashchange",()=>setTimeout(()=>presTouch(),50));
document.addEventListener("visibilitychange",()=>{if(document.hidden)presLeave();else{presGone=false;presTouch(true)}});
addEventListener("pagehide",()=>{presGone=true;presLeave()});
addEventListener("pageshow",()=>{presGone=false});
setInterval(()=>{presTouch();presPaint()},30000);
document.addEventListener("change",e=>{if(e.target&&e.target.id==="mynamelive"){MP.name=e.target.value.trim();mpSaveLocal();presTouch(true);
  if(isMember()||MP.roleId!=="__owner")pref().collection("members").doc(UID).update({name:MP.name}).catch(()=>{})}});

/* ---------- fiók: a hozzáférés e-mailhez kötése ----------
   Alapból névtelen (anonim) belépéssel megy minden, ami a készülékhez kötött. Ha e-mailt és jelszót adsz hozzá,
   ugyanaz a felhasználó marad (a tulajdonosi jog is), és egy másik eszközön belépve visszakapod a közös projektjeidet.
   A projektek listája: users/{uid}/projects/{pid}. */
const ACCKEY="aperation-account";
const accLoad=()=>{try{return JSON.parse(localStorage.getItem(ACCKEY)||"null")}catch(e){return null}};
const accSave=a=>{try{if(a){localStorage.setItem(ACCKEY,J(a));localStorage.setItem("aperation-had-acc","1")}else localStorage.removeItem(ACCKEY)}catch(e){}};
let accList=null,accBusy=false;
function myProjRec(){
  if(!fdb||!UID||!MP.on||!MP.pid||PV)return;
  fdb.collection("users").doc(UID).collection("projects").doc(MP.pid).set({title:P.title||MP.title||"",roleId:MP.roleId||"",roleName:MP.roleName||"",code:MP.code||"",mode:MP.mode||"",name:MP.name||"",ts:Date.now()},{merge:true}).catch(()=>{});
}
const accErr=e=>{const c=e&&e.code||"";return{
  "auth/email-already-in-use":"Ez az e-mail már egy fiókhoz tartozik. Lépj be vele lent.",
  "auth/credential-already-in-use":"Ez az e-mail már egy fiókhoz tartozik. Lépj be vele lent.",
  "auth/invalid-email":"Ez nem érvényes e-mail-cím.",
  "auth/weak-password":"A jelszó legyen legalább 6 karakter.",
  "auth/missing-password":"Add meg a jelszót.",
  "auth/wrong-password":"Hibás e-mail vagy jelszó.","auth/invalid-credential":"Hibás e-mail vagy jelszó.","auth/invalid-login-credentials":"Hibás e-mail vagy jelszó.","auth/user-not-found":"Hibás e-mail vagy jelszó.",
  "auth/too-many-requests":"Túl sok próbálkozás. Várj pár percet.",
  "auth/operation-not-allowed":"Az e-mailes belépés még nincs bekapcsolva a Firebase-ben (Authentication → Sign-in method → Email/Password).",
  "auth/network-request-failed":"Nincs internet. Próbáld újra, ha van térerő."}[c]||("Nem sikerült: "+(c||e))};
function acctCard(){
  if(!MP_AVAIL||isMember()&&!accLoad())return"";
  const a=accLoad();
  if(a)return`<section class="card" id="acctcard"><div class="card-head"><h2>Fiók</h2><span class="chip" style="--c:var(--ok)">${ic("check",14)}Mentve</span></div>
    <p class="muted small">Bejelentkezve: <b>${esc(a.email)}</b>. Ha elveszik vagy cseréled a telefonod, egy másik eszközön ezzel belépve visszakapod a közös projektjeidet, tulajdonosként is.</p>
    <div class="wgrid"><button class="btn" type="button" data-do="accprojs">${ic("list",16)}Közös projektjeim</button><button class="btn" type="button" data-do="accout">Kijelentkezés</button></div>
    <div id="acclist">${accListHTML()}</div></section>`;
  return`<section class="card" id="acctcard"><h2>Fiók</h2>
    <p class="muted small">A közös projektek most <b>ehhez a készülékhez</b> kötődnek. Kösd őket e-mailhez: ha elveszik, összetörik vagy cseréled a telefonod, egy másik eszközön belépve visszakapod őket, a tulajdonosi joggal együtt. Nem kell hozzá semmit telepíteni.</p>
    <div class="eg"><label class="fi"><span class="flab">E-mail</span><input id="accmail" type="email" autocomplete="email" inputmode="email" placeholder="nev@pelda.hu"></label>
      <label class="fi"><span class="flab">Jelszó (legalább 6 karakter)</span><input id="accpw" type="password" autocomplete="current-password"></label></div>
    <div class="wgrid"><button class="btn solid" type="button" data-do="acclink">${ic("check",16)}Hozzáférés mentése</button><button class="btn" type="button" data-do="accin">Belépés meglévő fiókba</button></div>
    <p class="muted small"><b>Hozzáférés mentése:</b> ezen a készüléken az eddigi projektek az új fiókhoz kerülnek. <b>Belépés:</b> ha egy másik eszközön már mentetted, itt visszakapod. <button type="button" class="linkbtn" data-do="accreset">Elfelejtett jelszó</button></p></section>`;
}
function accListHTML(){
  if(accList==null)return"";
  if(!accList.length)return`<p class="muted small">Még nincs közös projekted ezzel a fiókkal.</p>`;
  return`<div class="rows">${accList.map(r=>`<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div><b>${esc(r.title||"Névtelen projekt")}</b><small>${esc(r.roleId==="__owner"?"tulajdonos":r.mode==="admin"?"társszerkesztő":r.roleName||"tag")}${MP.on&&MP.pid===r.id?" · ezen az eszközön nyitva":""}</small></div>${MP.on&&MP.pid===r.id?"":`<button class="btn sm" type="button" data-accopen="${esc(r.id)}">Megnyitás</button>`}</div>`).join("")}</div>`;
}
async function accRefreshList(){
  try{await fbInit();const q=await fdb.collection("users").doc(UID).collection("projects").get();
    accList=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0))}catch(e){accList=[];toast(accErr(e),{tone:"warn"})}
  const l=$("#acclist");if(l)l.innerHTML=accListHTML();
}
async function accLink(btn){
  const m=($("#accmail")||{}).value||"",pw=($("#accpw")||{}).value||"";if(!m.trim()||!pw){toast("Add meg az e-mailt és a jelszót.");return}
  if(accBusy)return;accBusy=true;btn.disabled=true;
  try{await fbInit();const u=fauth.currentUser;
    await u.linkWithCredential(firebase.auth.EmailAuthProvider.credential(m.trim(),pw));
    accSave({email:m.trim()});if(MP.on)myProjRec();toast("Hozzáférés mentve. Másik eszközön ezzel az e-maillel lépj be.",{tone:"ok",ms:6000});renderAll();
  }catch(e){toast(accErr(e),{tone:"warn",ms:7000})}
  accBusy=false;btn.disabled=false;
}
async function accIn(btn){
  const m=($("#accmail")||{}).value||"",pw=($("#accpw")||{}).value||"";if(!m.trim()||!pw){toast("Add meg az e-mailt és a jelszót.");return}
  if(MP.on&&MP.roleId==="__owner"&&!sure(btn,"Ezen az eszközön van saját közös projekt, ami nincs mentve. Biztos?"))return;
  if(accBusy)return;accBusy=true;btn.disabled=true;
  try{await fbInit();
    if(MP.on)await mpLeave(true);
    await fauth.signInWithEmailAndPassword(m.trim(),pw);UID=fauth.currentUser.uid;
    accSave({email:m.trim()});toast("Beléptél. Válaszd ki, melyik közös projektet nyitod meg.",{tone:"ok"});
    location.hash="#info";renderAll();await accRefreshList();
  }catch(e){toast(accErr(e),{tone:"warn",ms:7000})}
  accBusy=false;btn.disabled=false;
}
async function accOpen(pid){
  const r=(accList||[]).find(x=>x.id===pid);if(!r)return;
  try{await fbInit();
    const ok=await fdb.collection("projects").doc(pid).get().then(d=>d.exists).catch(()=>false);
    if(!ok){toast("Ez a közös projekt már nem létezik.",{tone:"warn"});fdb.collection("users").doc(UID).collection("projects").doc(pid).delete().catch(()=>{});accList=accList.filter(x=>x.id!==pid);const l=$("#acclist");if(l)l.innerHTML=accListHTML();return}
    if(MP.on)await mpLeave(true);
    try{localStorage.setItem(LOCALP,JSON.stringify(P));localStorage.setItem(LOCALS,JSON.stringify(st))}catch(e){}
    const admin=r.mode==="admin";
    MP={...MP,base:null,on:true,mode:admin?"admin":"member",pid,roleId:r.roleId,code:r.code,name:r.name||"",perm:admin?ALLPERM:null,roleName:r.roleName||"",title:r.title||"",roles:[],members:[],lastPub:0,liveTs:0,leaving:false};
    if(!admin){P=normP({});applyProject()}
    const s=st.sound;st=fresh();st.sound=s;mpApplying=true;save();mpApplying=false;
    mpSaveLocal();mpListen();if(admin){editSec="projekt";location.hash="#terv"}else location.hash="#most";renderAll();
    toast(`Megnyitva: ${r.title||"közös projekt"}`,{tone:"ok"});
  }catch(e){toast(accErr(e),{tone:"warn"})}
}
async function accOut(btn){
  if(!sure(btn,"Biztos? Koppints újra"))return;
  try{await fbInit();if(MP.on)await mpLeave(true);await fauth.signOut();UID=null;accSave(null);accList=null;authMode="in";authMsg="";toast("Kijelentkeztél ezen az eszközön.");renderAll()}catch(e){toast(accErr(e),{tone:"warn"})}
}
async function accReset(){
  const m=(($("#accmail")||{}).value||"").trim();if(!m){toast("Írd be fent az e-mail-címed, és koppints újra.");return}
  try{await fbInit();await fauth.sendPasswordResetEmail(m);toast("Elküldtük a jelszó-visszaállító e-mailt (nézd meg a spam mappát is).",{tone:"ok",ms:6000})}catch(e){toast(accErr(e),{tone:"warn"})}
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-do],[data-accopen]");if(!t)return;const d=t.dataset;
  if(d.accopen){accOpen(d.accopen);return}
  if(d.do==="acclink")accLink(t);else if(d.do==="accin")accIn(t);else if(d.do==="accout")accOut(t);else if(d.do==="accreset")accReset();
  else if(d.do==="accprojs")accRefreshList();
  else if(d.do==="gotoacct"){location.hash="#info";setTimeout(()=>{const c=$("#acctcard");c&&c.scrollIntoView({block:"start",behavior:"smooth"})},200)}});

/* ---------- belépés: az app a belépéssel fogad ----------
   Szerkesztéshez (saját diszpó, társszerkesztés) fiók kell. Kivétel: aki egy stábpozícióra kapott meghívót
   (link vagy kód), az fiók nélkül is csatlakozhat. Net nélkül az első indításkor tovább lehet lépni. */
const AUTH_REQ=MP_AVAIL&&!(/^(localhost|127\.)/.test(location.hostname)&&!/[?&]auth\b/.test(location.search));
const JOINNAME="aperation-join-name";

    {_id:b._id||uid(),d:Math.max(0,Math.round(+b.d||0)),type:TYPES.includes(b.type)?b.type:"shoot",images:(b.images||[]).filter(x=>x&&(x.url||x.idb))}));

// egy fénybeállítás mely shotokhoz tartozik: a Név és a Kód shotszámai (pl. „1/3”, „1/6a”, „1/3, 1/4”)
function groupShotIds(g){const out=new Set();[g.name,g.code].forEach(v=>{const s=String(v||"");const m=s.match(/\d+\s*\/\s*\d+[A-Za-z]*/g);(m||[]).forEach(x=>out.add(x.replace(/\s/g,"")))});return[...out]}
function applyProject(){
  const p=P;let t=p.call;
  const SL={};p.shots.forEach(s=>{const c=String(s.code||"").replace(/\s/g,"");if(c&&!SL[c])SL[c]=s});
  const slOf=b=>b.type==="shoot"?shotIds((b.label||"").trim()).map(i=>SL[i]).filter(Boolean):[];
  const uniq=a=>[...new Set(a.filter(Boolean))];
  const blocks=p.blocks.map(b=>{const ss=slOf(b),o={s:t,d:b.d,type:b.type,label:(b.label||"").trim()||TNAME[b.type],setup:b.setup||ss.map(s=>[s.size,s.lens,s.move].filter(Boolean).join(", ")).filter(Boolean).join(" + "),note:b.note||"",group:(b.group||"").trim(),skippable:!!b.skippable};t+=b.d;return o});
  const groups={};p.groups.forEach(g=>{if(String(g.code).trim())groups[String(g.code).trim()]=[g.name||"",g.desc||"",(g.images||[]).map(x=>{const u=x.url||IMG[x.idb];return u?{id:String(g.code).trim(),t:u,f:u}:null}).filter(Boolean)]});
  const cast=p.cast.filter(c=>c.name||c.role).map((c,k)=>({...c,k}));
  const crew=p.crew.filter(c=>c.name||c.pos).map(c=>({...c,dept:c.dept||"Stáb"}));
  const shots={},boards=[],vilko=[];
  // vilkó a shothoz: ha egy fénybeállítás Neve (vagy Kódja) egy shot száma a shotlistből (pl. „1/3”, vagy több: „1/3, 1/4”),
  // a vilkója annak a shotnak a mellé kerül (shotlist, Most nézet, nyomtatott shotlist)
  const VKBY={};
  p.groups.forEach(g=>{const imgs=(g.images||[]).map(x=>x.url||IMG[x.idb]).filter(Boolean);if(!imgs.length)return;
    groupShotIds(g).forEach(k=>{if(!SL[k])return;const a=VKBY[k]=VKBY[k]||[];imgs.forEach(u=>{if(!a.some(y=>y.f===u))a.push({id:(g.name||g.code||k).trim(),t:u,f:u,g:(g.code||"").trim()})})})});
  p.blocks.forEach((b,i)=>{
    if(b.type!=="shoot")return;const lab=blocks[i].label;if(shots[lab])return;
    const ids=shotIds(lab);
    const ss=slOf(b),simgs=ss.flatMap(s=>(s.images||[]).map(x=>({...x,kind:x.kind||"sb"})));
    const img=k=>[...(b.images||[]),...simgs].filter(x=>x.kind===k).map(x=>{const u=x.url||IMG[x.idb];return u?{id:lab,t:u,f:u}:null}).filter(Boolean);
    const sb=img("sb"),vk=img("vk");ids.forEach(i=>(VKBY[i]||[]).forEach(x=>{if(!vk.some(y=>y.f===x.f))vk.push(x)}));
    boards.push(...sb);vk.forEach(x=>{if(!vilko.some(y=>y.f===x.f))vilko.push(x)});
    const segs=[];let cur=null,head="";
    p.script.forEach(l=>{if(l.t==="sh"&&!(l.ids||[]).length){head=l.x;cur=null;return}
      if((l.ids||[]).some(x=>ids.includes(x))){if(!cur){cur={lab:head,lines:[]};segs.push(cur)}cur.lines.push(l)}else cur=null});
    shots[lab]={ids,talent:splitList(b.talent).length?splitList(b.talent):uniq(ss.flatMap(s=>splitList(s.talent))),offcam:[],props:uniq([...splitLines(b.props),...ss.flatMap(s=>splitLines(s.props))]),
      story:b.story||ss.map(s=>s.story||s.desc).filter(Boolean).join(" "),desc:ss.map(s=>s.desc).filter(Boolean).join(" "),sb,vk,segs};
  });
  D={title:p.title,src:p.src||"saját terv",plan:{call:p.call,targetWrap:p.wrapTarget},blocks,shots,groups,cast,crew,boards,vilko,vkByShot:VKBY,
    script:p.script.filter(l=>l.x).map(l=>({t:l.t,x:l.x,cov:(l.ids||[]).length?[{ids:l.ids}]:[]})),
    contacts:[...p.crew,...p.cast].filter(c=>c.name&&c.phone).map(c=>({role:c.pos||c.role,name:c.name,phone:c.phone})),
    location:p.location,parking:p.parking,notes:p.notes.filter(Boolean)};
  B=D.blocks.map((b,i)=>({...b,i,e:b.s+b.d}));
  TOTAL=Math.max(1,B.reduce((a,b)=>a+b.d,0));PLAN_WRAP=B.length?B[B.length-1].e:p.call;
  TARGET=Math.max(p.wrapTarget||PLAN_WRAP,PLAN_WRAP);
  CASTBY={};cast.forEach(c=>{if(c.role)CASTBY[c.role.toLowerCase()]=c;if(c.name)CASTBY[c.name.toLowerCase()]=c});
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(p.date||"");HASDATE=!!m;SHOOT_DATE=m?new Date(+m[1],m[2]-1,+m[3]):new Date(2000,0,1);
  TOUR_SHOT=B.find(b=>b.type==="shoot"&&B[b.i+1]&&B[b.i+1].type==="move"&&b.i>2)||B.find(b=>b.type==="shoot"&&B[b.i+1]&&B[b.i+1].type==="move")||B.find(b=>b.type==="shoot")||null;
  if(st.cur&&st.cur.i>=B.length)st.cur=B.length?{...st.cur,i:B.length-1}:null;
  document.title=(p.title?p.title+" · ":"")+"APERATION";
}

function setProject(p,o={}){if(o.archive)archiveCurrent();P=normP(p);if(o.reset){const s=st.sound;st=fresh();st.sound=s;save()}saveP();applyProject();loadImgs();lastHero=null;renderAll()}
function withRemap(fn){
  const old=P.blocks.map(b=>b._id);fn();const n={};P.blocks.forEach((b,i)=>n[b._id]=i);
  const mo=o=>{const r={};for(const k in o){if(k==="gen"){r[k]=o[k];continue}const id=old[k];if(id!=null&&n[id]!=null)r[n[id]]=o[k]}return r};
  st.act=mo(st.act);st.skip=mo(st.skip);st.ext=mo(st.ext);st.takes=mo(st.takes);
  if(st.cur){const id=old[st.cur.i];st.cur=n[id]!=null?{...st.cur,i:n[id]}:(P.blocks.length?{...st.cur,i:Math.min(st.cur.i,P.blocks.length-1)}:null)}

/* képek a készüléken (IndexedDB) */
const idb=(()=>{let o;const open=()=>o=o||new Promise((res,rej)=>{const r=indexedDB.open("diszpo-app",1);r.onupgradeneeded=()=>r.result.createObjectStore("img");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const tx=(m,f)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction("img",m),q=f(t.objectStore("img"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
  return{put:(k,v)=>tx("readwrite",s=>s.put(v,k)),get:k=>tx("readonly",s=>s.get(k)),del:k=>tx("readwrite",s=>s.delete(k))}})();
async function loadImgs(){let n=0;for(const b of [...P.blocks,...P.groups,...P.shots])for(const x of b.images||[])if(x.idb&&!IMG[x.idb]){try{const bl=await idb.get(x.idb);if(bl){IMG[x.idb]=URL.createObjectURL(bl);n++}}catch(e){}}
  if(n){applyProject();if(view!=="terv")renderAll();else renderEdit()}}
async function shrink(file){
  try{const bm=await createImageBitmap(file),k=Math.min(1,2400/Math.max(bm.width,bm.height));if(k>=1&&file.size<1.5e6)return file;
    const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.86))}catch(e){return file}}

/* fájlok mentése */
// Telefonon (főleg a főképernyős appban) a böngészős letöltés nem működik: ott a rendszer Megosztás menüjét
// nyitjuk meg (Mentés a Fájlokba, AirDrop, levél, megnyitás Excelben). Ha a megosztás a várakozás miatt nem
// indulhat, egy gomb jelenik meg, amire koppintva azonnal megnyílik.
const shareFile=file=>navigator.share({files:[file],title:file.name});
async function saveFile(name,data,mime){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||"application/octet-stream"});
  try{const dl=window.claude&&claude.use?await claude.use("downloads"):null;
    if(dl){try{await dl.save({filename:name,data:blob});return}catch(e){if(e&&e.code==="declined")return;}}}catch(e){}
  const phone=typeof IS_IOS!=="undefined"&&(IS_IOS||IS_ANDROID);
  if(phone&&navigator.canShare){
    const file=new File([blob],name,{type:blob.type||mime||"application/octet-stream"});
    let ok=false;try{ok=navigator.canShare({files:[file]})}catch(e){}
    if(ok){try{await shareFile(file);return}catch(e){if(e&&e.name==="AbortError")return;
        toast("Kész: "+name,{action:"Megosztás / mentés",fn:()=>shareFile(file).catch(()=>{}),ms:15000});return}}
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  if(phone)toast("Ha nem jött le a fájl: "+name,{action:"Megnyitás",fn:()=>window.open(url,"_blank"),ms:12000});
}

const nk=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
const cellS=v=>{if(v==null)return"";let s=String(v).trim();return/^[-–—]$/.test(s)?"":s};
function tmin(v){
  if(v===""||v==null)return null;
  if(typeof v==="number"){if(v<1)return Math.round(v*1440);if(v%1)return Math.round((v%1)*1440);return v<=24?v*60:v}
  if(v instanceof Date)return v.getHours()*60+v.getMinutes();
  const m=String(v).match(/(\d{1,2})\s*[:.]\s*(\d{2})/);return m?+m[1]*60+ +m[2]:null;
}
function dmin(v){
  if(v===""||v==null)return null;
  if(typeof v==="number")return v<1&&v>0?Math.round(v*1440):Math.round(v);
  const s=String(v);const hm_=s.match(/^(\d{1,2}):(\d{2})/);if(hm_)return +hm_[1]*60+ +hm_[2];
  const m=s.replace(",",".").match(/\d+(\.\d+)?/);return m?Math.round(+m[0]):null;
}
const capWords=s=>s&&s===s.toUpperCase()&&/[A-ZÁÉÍÓÖŐÚÜŰ]{3}/.test(s)?s.toLowerCase().replace(/(^|[\s\-.])(\S)/g,(a,b,c)=>b+c.toUpperCase()):s;

  if(/^(atal|opti|move|valt)/.test(k))return"move";if(/^(ebed|lunch|szunet)/.test(k))return"lunch";if(/^(tart|res|puffer)/.test(k))return"res";
  const l=nk(label);if(/ebed/.test(l))return"lunch";if(/^(atallas|optika)/.test(l))return"move";if(/^\d+\/?\d/.test(String(label||"").trim()))return"shoot";if(/tartalek/.test(l))return"res";return"prep";
}

  ["group",h=>/^(feny|light)/.test(h)],["talent",h=>/^(szereplo|talent|szinesz|cast)/.test(h)],["props",h=>/^(kellek|props|kontinuitas)/.test(h)],["story",h=>/^(sztori|story|tortenet)/.test(h)],["skip",h=>/^(kihagyhato|skip|opcionalis)/.test(h)]],

function mapCols(row,kind){const m={};row.forEach((v,c)=>{const h=nk(v);if(!h)return;for(const [k,f] of COLDEF[kind])if(m[k]==null&&f(h)){m[k]=c;break}});return m}
function headerKind(row){
  if(row.filter(v=>cellS(v)).length<2)return null;

  m=mapCols(row,"cast");if(row.some(v=>/^(szinesz|actor)/.test(nk(v)))||(m.role!=null&&m.name!=null&&(m.ruha!=null||m.smink!=null||m.onset!=null||m.arr!=null)))return["cast",m];
  m=mapCols(row,"script");if(m.x!=null&&m.t!=null)return["script",m];
  m=mapCols(row,"shotlist");if(m.code!=null&&(m.size!=null||m.lens!=null||m.move!=null))return["shotlist",m];
  m=mapCols(row,"groups");if(m.code!=null&&(m.name!=null||m.desc!=null))return["groups",m];
  m=mapCols(row,"timeline");if(m.label!=null&&(m.d!=null||m.start!=null)&&(m.type!=null||m.setup!=null||m.note!=null))return["timeline",m];
  return null;

function parseDate(v){
  if(typeof v==="number"&&v>20000&&window.XLSX){const d=XLSX.SSF.parse_date_code(v);if(d)return`${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`}
  const m=String(v||"").match(/(20\d\d)\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`:"";
}
function importBook(wb,fname){
  const R={blocks:[],shotlist:[],cast:[],crew:[],groups:[],script:[],notes:[],warn:[]},kv={};let firstText="",dateGuess="";const contacts=[];
  const phoneRe=/^\+?[\d][\d\s\-\/()]{6,}$/;
  for(const sn of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:""});
    let i=0;
    while(i<rows.length){
      const row=rows[i]||[],hk=headerKind(row);
      if(hk){const [kind,m]=hk;i++;let empty=0,dept="";const out=[];
        for(;i<rows.length;i++){
          const r=rows[i]||[];if(!r.some(v=>cellS(v))){if(++empty>=2)break;continue}empty=0;
          if(headerKind(r)){break}
          const g=k=>m[k]==null?"":r[m[k]];
          if(kind==="timeline"){
            const label=cellS(g("label"));if(nk(label)==="wrap"){i++;break}
            if(!label&&!cellS(g("type"))&&dmin(g("d"))==null)continue;
            out.push({type:typeOf(g("type"),label),d:dmin(g("d")),_s:tmin(g("start")),_e:tmin(g("end")),label,setup:cellS(g("setup")),note:cellS(g("note")),group:cellS(g("group")),
              talent:cellS(g("talent")),props:cellS(g("props")),story:cellS(g("story")),skippable:yes(g("skip")),
              images:[...splitList(g("sb")).filter(u=>/^https?:|^data:/.test(u)).map(u=>({kind:"sb",url:u})),...splitList(g("vk")).filter(u=>/^https?:|^data:/.test(u)).map(u=>({kind:"vk",url:u}))]});
          }else if(kind==="crew"){
            const pos=cellS(g("pos")),name=cellS(g("name"));
            if(pos&&!name&&!cellS(g("arr"))&&r.filter(v=>cellS(v)).length===1){dept=pos===pos.toUpperCase()?pos.charAt(0)+pos.slice(1).toLowerCase():pos;continue}
            if(!pos&&!name)continue;
            out.push({dept:cellS(g("dept"))||dept,pos:capWords(pos),name:capWords(name),arr:hhmm(tmin(g("arr"))),phone:cellS(g("phone"))});
          }else if(kind==="cast"){
            const name=cellS(g("name")),role=cellS(g("role"));if(!name&&!role)continue;
            const t=k=>{const v=g(k);const x=tmin(v);return x!=null?hhmm(x):cellS(v)};
            out.push({role:capWords(role),name:capWords(name),arr:t("arr"),ruha:t("ruha"),smink:t("smink"),haj:t("haj"),onset:t("onset"),phone:cellS(g("phone"))});
          }else if(kind==="groups"){
            const code=cellS(g("code"));if(!code)continue;out.push({code,name:cellS(g("name")),desc:cellS(g("desc")),images:splitList(g("img")).filter(u=>/^https?:|^data:/.test(u)).map(u=>({kind:"vk",url:u}))});
          }else if(kind==="shotlist"){
            const code=cellS(g("code")),desc=cellS(g("desc"));if(!code&&!desc)continue;
            out.push({code,size:cellS(g("size")),lens:cellS(g("lens")),move:cellS(g("move")),desc,talent:cellS(g("talent")),props:cellS(g("props")),story:cellS(g("story")),note:cellS(g("note")),
              images:splitList(g("sb")).filter(u=>/^https?:|^data:/.test(u)).map(u=>({kind:"sb",url:u}))});
          }else if(kind==="script"){
            const x=cellS(g("x"));if(!x)continue;const k=nk(g("t"));
            const t=/^(jel|hely|sh|scene|int|ext|belso|kulso)/.test(k)?"sh":/^(szerep|karakter|ch|nev)/.test(k)?"ch":/^(instr|zarojel|pa|paren)/.test(k)?"pa":/^(dial|szov|dl|beszed)/.test(k)?"dl":/^(veg|end)/.test(k)?"end":"ac";
            out.push({t,x,ids:shotIds(cellS(g("ids"))).length&&cellS(g("ids"))?splitList(g("ids")).flatMap(shotIds):[]});
          }

        continue;
      }

        if(!firstText&&i<3&&s.length>1&&!/[:]/.test(s))firstText=s;
        if(!dateGuess&&i<8)dateGuess=parseDate(s);
        let key=s,val="";const ci=s.indexOf(":");
        if(ci>0&&ci<30){key=s.slice(0,ci);val=s.slice(ci+1).trim()}
        if(!val){for(let c2=c+1;c2<row.length;c2++)if(cellS(row[c2])!==""){val=row[c2];break}}
        const k=nk(key);if(!k)return;
        const put=(n,x)=>{if(kv[n]==null&&x!==""&&x!=null)kv[n]=x};
        if(/^(crewcall|call|kezdes|munkakezdes)$/.test(k))put("call",val);
        else if(/^(tervezettwrap|wrap|wraphatar|wrapcel|celwrap)$/.test(k))put("wrap",val);
        else if(/^(cim|projekt|projektcim|film|filmcim|cimfilm)$/.test(k))put("title",val);
        else if(/^(datum|forgatasinap|nap)$/.test(k))put("date",val);
        else if(/^helyszin/.test(k))put("loc",val);
        else if(/^parkolas/.test(k))put("park",val);
        else if(/^(fontos|megjegyzes|biztonsag)/.test(k)&&c===0&&val&&typeof val==="string")R.notes.push(/^biztonsag/.test(k)?"BIZTONSÁG: "+val:val);
        else if(ci>0&&val&&typeof val==="string"&&/^[A-ZÁÉÍÓÖŐÚÜŰa-záéíóöőúüű0-9 .\-]{2,30}$/.test(key)&&/\s/.test(val)){
          const nx=cellS((rows[i+1]||[])[c]);if(phoneRe.test(nx))contacts.push({pos:key.trim(),name:val,phone:nx});
        }
      });
      i++;
    }
  }
  // kezdés/vég → percek, ha nincs perc oszlop
  R.blocks.forEach((b,k)=>{if(b.d==null){const n=R.blocks[k+1];b.d=b._e!=null&&b._s!=null?b._e-b._s:(n&&n._s!=null&&b._s!=null?n._s-b._s:0);if(b.d<0)b.d+=1440}});
  const call=tmin(kv.call)??(R.blocks[0]&&R.blocks[0]._s)??480;
  R.blocks.forEach(b=>{delete b._s;delete b._e});
  contacts.forEach(c=>{const m=R.crew.find(x=>nk(x.name)===nk(c.name));if(m){if(!m.phone)m.phone=c.phone}else R.crew.unshift({dept:"Kapcsolat",pos:c.pos,name:c.name,arr:"",phone:c.phone})});
  if(!R.blocks.length)R.warn.push("Nem találtam időrend-táblázatot. Kell egy fejlécsor, benne legalább: Perc (vagy Kezdés), Típus és Blokk / shot.");

    location:cellS(kv.loc),parking:cellS(kv.park),notes:R.notes,blocks:R.blocks,shots:R.shotlist,groups:R.groups,cast:R.cast,crew:R.crew,script:R.script,src:fname||"Excel",_warn:R.warn});
}
let pending=null;

/* ---------- szövegből szkript ---------- */
function parseScript(txt){
  const out=[];let prev="";
  String(txt||"").replace(/\r/g,"").split("\n").forEach(raw=>{
    const s=raw.trim();if(!s){prev="";return}
    let t="ac";
    if(/^(\d+\.?\s*)?(BELSŐ|KÜLSŐ|BELSO|KULSO|INT\.?\/EXT|INT|EXT)(?=[\s.\/:,–-]|$)/i.test(s))t="sh";
    else if(/^\(.*\)$/.test(s))t="pa";
    else if(/^(VÉGE|VEGE|THE END|FADE OUT)\.?$/i.test(s))t="end";
    else if(s===s.toUpperCase()&&/[A-ZÁÉÍÓÖŐÚÜŰ]/.test(s)&&s.length<=32&&!/[.!?]$/.test(s))t="ch";
    else if(prev==="ch"||prev==="pa"||prev==="dl")t="dl";
    out.push({t,x:s,ids:[]});prev=t;
  });
  return out;
}

let DR=null;
function drMove(){
  if(!DR)return;const py=DR.cy+scrollY,dy=py-DR.startY;
  DR.el.style.transform=`translateY(${dy}px) scale(1.02)`;
  const c=DR.top[DR.k]+DR.h[DR.k]/2+dy;let t=0;
  for(let i=0;i<DR.cards.length;i++)if(i!==DR.k&&DR.top[i]+DR.h[i]/2<c)t++;
  if(t!==DR.t){DR.t=t;try{navigator.vibrate&&navigator.vibrate(5)}catch(e){}
    const sh=DR.h[DR.k]+DR.gap;
    DR.cards.forEach((el,i)=>{if(i===DR.k)return;const v=DR.t>DR.k&&i>DR.k&&i<=DR.t?-sh:DR.t<DR.k&&i>=DR.t&&i<DR.k?sh:0;el.style.transform=v?`translateY(${v}px)`:""});
    if(DR.list!=="blocks")return;
    const order=DR.cards.map((_,i)=>i).filter(i=>i!==DR.k);order.splice(DR.t,0,DR.k);let tm=P.call;
    order.forEach(i=>{const x=DR.cards[i].querySelector("[data-bs]");x&&(x.textContent=hm(tm));tm+=P.blocks[i].d});
  }
}
function drLoop(){if(!DR)return;const y=DR.cy,edgeT=140,edgeB=innerHeight-130;
  let v=0;if(y<edgeT)v=-Math.min(12,(edgeT-y)/6);else if(y>edgeB)v=Math.min(12,(y-edgeB)/6);
  if(v){scrollBy(0,v);drMove()}DR.raf=requestAnimationFrame(drLoop)}
function drEnd(cancel){
  if(!DR)return;const d=DR;DR=null;cancelAnimationFrame(d.raf);document.body.classList.remove("eb-dragging");
  d.cards.forEach(el=>{el.style.transform="";el.classList.remove("dragging","shift")});
  if(cancel||d.t===d.k){renderEdit();return}
  if(d.list!=="blocks"){const L=P[d.list],it=L.splice(d.k,1)[0];L.splice(d.t,0,it);commit();renderEdit();
    toast("Áthelyezve.",{action:"Visszavonás",fn:()=>{const x=L.splice(d.t,1)[0];L.splice(d.k,0,x);commit();renderEdit()}});return}
  const from=d.k,to=d.t,b=P.blocks[from];
  withRemap(()=>{P.blocks.splice(from,1);P.blocks.splice(to,0,b)});renderEdit();
  const c=$(`.eb[data-k="${to}"]`);c&&c.classList.add("dropped");
  toast(`Áthelyezve: ${b.label||TNAME[b.type]} · kezdés ${hm(B[to].s)}${[to-1,to,to+1].some(i=>P.blocks[i]&&P.blocks[i].type==="move"&&(P.blocks[i-1]||{}).type==="move")?" · Figyelem: két átállás került egymás mellé":""}`,{action:"Visszavonás",fn:()=>{withRemap(()=>{const x=P.blocks.splice(to,1)[0];P.blocks.splice(from,0,x)});renderEdit()}});
}

/* ---------- automatikus mentés és teljes projektfájl ----------
   1) Minden módosítás azonnal a készülékre mentődik; ha az app háttérbe kerül vagy bezárják, a függő mentés is lezárul.
   2) Percenként (ha változott valami) biztonsági pillanatkép készül egy külön adatbázisba; az utolsó 30 megmarad,
      és a Terv → Fájl → Automatikus mentések részen bármelyik visszaállítható.
   3) „Projekt exportálása”: egyetlen fájl (.aperation.json) a teljes tervvel, a forgatókönyv-jelölésekkel, a képekkel
      és a nap állásával; bármelyik APERATION-ben visszatölthető (Fájl → betöltés, vagy ráhúzva). */
const BK_MAX=30;
const bkdb=(()=>{let o;const open=()=>o=o||new Promise((res,rej)=>{const r=indexedDB.open("aperation-backup",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("snap",{keyPath:"ts"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const tx=(m,f)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction("snap",m),q=f(t.objectStore("snap"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
  return{put:v=>tx("readwrite",s=>s.put(v)),all:()=>tx("readonly",s=>s.getAll()),del:k=>tx("readwrite",s=>s.delete(k))}})();
let bkSig="",lastSaved=0;
function savedMark(){lastSaved=Date.now();const el=$("#savedind");if(el)el.innerHTML=savedText()}

  if(sig===bkSig)return;bkSig=sig;

    const all=(await bkdb.all()).sort((a,b)=>b.ts-a.ts);for(const x of all.slice(BK_MAX))await bkdb.del(x.ts)}catch(e){}
}

const blobToURL=bl=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(bl)});

/* projektkulcs: egyetlen, teljesen offline fájl, benne minden (terv, shotlist, forgatókönyv-jelölések, az összes kép
   teljes minőségben, take-napló, a csapat pozíciói). A közös szerver 30 napos képtörlése nem érinti. */
async function exportProjectFile(btn){
  flushSave();if(btn){btn.disabled=true}
  // közös projektben előbb letöltjük, ami még csak a szerveren van
  if(MP.on&&typeof mpFetchImgs==="function"){try{await mpFetchImgs()}catch(e){}}
  const images={};let miss=0;
  for(const b of [...P.blocks,...P.groups,...P.shots])for(const x of b.images||[])if(x.idb&&!images[x.idb]){try{const bl=await idb.get(x.idb);if(bl)images[x.idb]=await blobToURL(bl);else miss++}catch(e){miss++}}
  const team=isMpAdmin()&&MP.roles&&MP.roles.length?MP.roles.map(r=>({name:r.name,perm:r.perm})):null;
  const data={app:"APERATION",kind:"projekt",version:2,saved:new Date().toISOString(),project:P,state:{...st,sim:fresh().sim,sw:null},images,team};

  const all=[...D.cast,...D.crew],usedChk=Object.values(st.checkin).some(Boolean),missing=all.filter(c=>c.name&&!st.checkin[c.name]);

    ["Wrap",`terv ${hm(PLAN_WRAP)} · ${ended?"tény":"várható"} ${hm(wrapT)}`],["Eltérés",signMin(drift)],
    ["Shotok",`${shDone.length} / ${sh.length} kész${shSkip.length?` · ${shSkip.length} kihagyva`:""}`],["Take-ek",`${tk.length} · ebből jó ${good}`],["Hosszabbítás",extSum?`+${extSum}′`:"nem volt"]];
  const st8=(b,p)=>p.done?"kész":p.skip?"kihagyva":p.cur?"folyamatban":"nem kezdődött";
  const rows=B.map(b=>{const p=pp[b.i]||{},ad=p.done?Math.round(p.e-p.s):null,diff=ad!=null?ad-b.d:null,t=st.takes[b.i]||[];

];
function tourState(kind){
  if(tour.state===kind)return;tour.state=kind;
  const sb=TOUR_SHOT,s=fresh(),now=Date.now();s.sound=false;
  for(const b of B)if(b.i<sb.i)s.act[b.i]={s:b.s,e:b.e};
  const mv=B[sb.i+1];
  if(kind==="move"&&mv){s.act[sb.i]={s:sb.s+2,e:sb.e+2};s.sim={on:true,start:mv.s+5,speed:1,base:now};s.cur={i:mv.i,at:mv.s+2}}
  else{s.sim={on:true,start:sb.s+11,speed:1,base:now};s.cur={i:sb.i,at:sb.s+2};s.takes[sb.i]=[{d:47,ok:false,note:"Anna elvétette a szöveget"},{d:52,ok:true,note:"Ez az! Rendező kedvence"}]}
  st=s;detailSeg="setre";
}
function tourStart(){
  if(tour)return;
  present(false);closeViewer();
  const pB=JSON.stringify(P),tmpP=!TOUR_SHOT;
  if(tmpP){P=normP(JSON.parse(JSON.stringify(MINTA)));applyProject()}
  TOUR=TOUR_F();
  let canDemo=!tmpP&&!st.cur&&!isShootDay();
  tour={i:0,state:null,backup:JSON.stringify(st),canDemo,tmpP,pB,ui:{editSec,openEB,pending}};pending=null;
  $("#tour").hidden=false;tourShow();
}
function tourShow(){
  const s=TOUR[tour.i],first=tour.i===0,last=tour.i===TOUR.length-1;
  tourState(s.state||"shoot");
  if(s.sec)editSec=s.sec;if(s.sec==="szkript")scrMode="mark";openEB=null;
  const want=s.view||"most";if(view!==want)location.hash="#"+want;
  renderAll();
  if(s.sel&&s.sel.startsWith("#tourblock")&&TOUR_SHOT){const c=document.querySelector(`.eb[data-k="${TOUR_SHOT.i}"]`);if(c)c.id="tourblock"}
  const card=$("#tourcard");
  card.innerHTML=`<div class="tour-top"><span class="cap">Bemutató${first||last?"":` · ${tour.i} / ${TOUR.length-2}`}</span>${last?"":`<button type="button" class="tour-skip" id="tskip">Kihagyás</button>`}</div>
    <h3 id="tourh">${s.title}</h3><p>${typeof s.html==="function"?s.html():s.html}</p>${s.extra||""}
    <div class="tour-nav">${last?'<span style="flex:1"></span>':`<div class="dots">${TOUR.map((_,k)=>`<i class="${k===tour.i?"on":""}"></i>`).join("")}</div>`}${first?"":`<button type="button" class="btn sm" id="tprev">Vissza</button>`}${last?(tour.canDemo?`<button type="button" class="btn sm" id="tclose">Bezárás</button><button type="button" class="btn sm solid" id="tdemo">Próba indítása</button>`:`<button type="button" class="btn sm solid" id="tclose">Kész</button>`):`<button type="button" class="btn sm solid" id="tnext">${first?"Kezdjük":"Tovább"}</button>`}</div>`;
  const g=id=>card.querySelector(id);
  g("#tnext")&&(g("#tnext").onclick=()=>tourGo(1));g("#tprev")&&(g("#tprev").onclick=()=>tourGo(-1));
  g("#tskip")&&(g("#tskip").onclick=()=>tourEnd(false));g("#tclose")&&(g("#tclose").onclick=()=>tourEnd(false));g("#tdemo")&&(g("#tdemo").onclick=()=>tourEnd(true));
  requestAnimationFrame(()=>{tourPlace();card.tabIndex=-1;card.focus({preventScroll:true})});
}
function tourGo(d){if(!tour)return;const n=tour.i+d;if(n<0)return;if(n>=TOUR.length)return tourEnd(false);tour.i=n;tourShow()}
function tourPlace(){
  if(!tour)return;
  const s=TOUR[tour.i],hole=$("#tourhole"),card=$("#tourcard"),vw=innerWidth,vh=innerHeight;
  const hdr=$(".hdr").getBoundingClientRect(),safeT=Math.max(0,Math.min(hdr.top,60)),safeB=DESK.matches?0:Math.max(0,vh-$("#tabs").getBoundingClientRect().bottom-8);
  let r=null;const el=s.sel&&document.querySelector(s.sel);
  if(el){
    if(!el.closest(".bottom,.hdr")){const b=el.getBoundingClientRect(),free=vh-hdr.bottom,want=b.height>free*.55?hdr.bottom+12:hdr.bottom+Math.max(12,(free-b.height)*.3);
      window.scrollTo({top:Math.max(0,scrollY+b.top-want),behavior:"instant"})}
    const b=el.getBoundingClientRect(),pad=6;
    r={l:Math.max(4,b.left-pad),t:Math.max(4,b.top-pad),r:Math.min(vw-4,b.right+pad),b:Math.min(vh-4,b.bottom+pad)};
  }
  hole.classList.toggle("none",!r);hole.style.borderRadius=el&&el.id==="ring"?"50%":"";
  if(r){hole.style.left=r.l+"px";hole.style.top=r.t+"px";hole.style.width=(r.r-r.l)+"px";hole.style.height=(r.b-r.t)+"px"}
  else{hole.style.left=vw/2+"px";hole.style.top=vh/2+"px";hole.style.width="0px";hole.style.height="0px"}
  const ch=card.offsetHeight,cw=card.offsetWidth,m=12;let top,left;
  if(!r){top=(vh-ch)/2;left=(vw-cw)/2}
  else{const below=r.b+m,above=r.t-m-ch;
    if(below+ch<=vh-m-safeB)top=below;else if(above>=m+safeT)top=above;else top=(r.t+r.b)/2<vh/2?vh-ch-m-safeB:m+safeT;
    left=Math.min(vw-cw-m,Math.max(m,(r.l+r.r)/2-cw/2))}
  card.style.top=Math.round(top)+"px";card.style.left=Math.round(left)+"px";
}
function tourEnd(startDemo){
  if(!tour)return;const t=tour;tour=null;$("#tour").hidden=true;
  st=Object.assign(fresh(),JSON.parse(t.backup));
  P=normP(JSON.parse(t.pB));applyProject();editSec=t.ui.editSec;openEB=t.ui.openEB;pending=t.ui.pending;
  if(t.cloud&&t.cloud.upd>st.upd){try{const x=JSON.parse(t.cloud.json);if(x&&x.v===1)st=Object.assign(fresh(),x)}catch(e){}}
  try{localStorage.setItem(TOUR_KEY,"1")}catch(e){}
  setTimeout(mpFlush,0);
  lastAlert="";detailSeg="setre";lastHero=null;
  if(startDemo){st.sim={on:true,start:D.plan.call-3,speed:10,base:Date.now()};save()}
  const back=t.tmpP?"terv":"most";if(t.tmpP)editSec="fajl";
  if(view!==back)location.hash="#"+back;
  renderAll();window.scrollTo({top:0});
  toast(startDemo?"Próba mód: 10× sebesség. Indítsd el a napot!":"A bemutatót az Info fülön bármikor újranézheted.");
}
addEventListener("resize",()=>tourPlace());
addEventListener("keydown",e=>{if(!tour)return;if(e.key==="Escape")tourEnd(false);else if(e.key==="ArrowRight"||(e.key==="Enter"&&e.target.id==="tourcard"))tourGo(1);else if(e.key==="ArrowLeft")tourGo(-1)});

/* ---------- telepítési feltétel (csak a telepíthető változatban) ----------
   Telefonon és tableten (iOS, Android) az app csak a főképernyőről indítva működik: böngészőben megnyitva
   egy útmutató takarja el, ami lépésről lépésre megmutatja a telepítést. Számítógépen nincs feltétel. */
const GATE=true;
const UA=navigator.userAgent;
const IS_IOS=/iPhone|iPad|iPod/.test(UA)||(/Macintosh/.test(UA)&&navigator.maxTouchPoints>1);
const IS_ANDROID=/Android/i.test(UA);
// iPhone/iPad: csak a navigator.standalone megbízható (csak főképernyőről indítva igaz); Androidon a display-mode.
const STANDALONE=IS_IOS?navigator.standalone===true:(matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||matchMedia("(display-mode: minimal-ui)").matches);
const DEV_BYPASS=/^(localhost|127\.)/.test(location.hostname)&&/[?&]nogate\b/.test(location.search);
const GATED=GATE&&(IS_IOS||IS_ANDROID)&&!STANDALONE&&!DEV_BYPASS;
let installEvt=null;

// meghívó link (?join=KÓD): a kódot telepítés előtt is megmutatjuk, mert iPhone-on a főképernyős app nem kapja meg a linket
const GJOIN=(()=>{const m=location.search.match(/[?&]join=([A-Za-z0-9-]{8,9})/);let c=m?m[1]:"";if(!c)try{c=localStorage.getItem("aperation-join")||""}catch(e){}
  c=c.toUpperCase().replace(/[^A-Z0-9]/g,"");return c.length===8?c.slice(0,4)+"-"+c.slice(4):""})();
function gateHTML(){
  const shareIc='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-4px"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  const dots='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="vertical-align:-4px"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
  const vdots='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="vertical-align:-4px"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
  const inApp=IS_IOS?!/Safari\//.test(UA)||/FBAN|FBAV|Instagram|Messenger|GSA\//.test(UA):/; wv\)|FBAN|FBAV|Instagram/.test(UA);
  const link=`<button type="button" class="btn" id="gcopy">${ic("copy",16)}Link másolása</button>`;
  let steps;
  if(inApp)steps=`<p class="muted">Ezt a linket most egy másik alkalmazás (pl. Messenger, Instagram, Gmail) belső böngészője nyitotta meg. Innen nem lehet a főképernyőre tenni.</p>
    <ol class="gsteps"><li>Koppints a jobb felső sarokban a ${dots} vagy ${shareIc} gombra.</li><li>Válaszd: <b>Megnyitás ${IS_IOS?"Safariban":"Chrome-ban"}</b> (vagy „Megnyitás böngészőben”).</li><li>Ott ezt az oldalt újra látod, a teendőkkel.</li></ol>${link}`;
  else if(IS_IOS)steps=`<ol class="gsteps">
      <li>Koppints a <b>Megosztás</b> gombra ${shareIc}. Safariban alul vagy a címsor mellett van; ha nem látod, előbb a ${dots} gombra.</li>
      <li>Görgess le, és válaszd: <b>Főképernyőhöz adás</b>.</li>
      <li>Ha van <b>Megnyitás webappként</b> kapcsoló, maradjon bekapcsolva. A név legyen <b>APERATION</b>.</li>
      <li>Koppints a <b>Hozzáadás</b> gombra.</li>
      <li>Zárd be a Safarit, és indítsd az appot a főképernyőn az <b>APERATION</b> ikonnal.</li></ol>
    <p class="muted small">Chrome-ban és más böngészőben iPhone-on is megy: Megosztás ${shareIc} → Főképernyőhöz adás.</p>`;
  else steps=`<button type="button" class="btn solid gbig" id="ginstall" hidden>${ic("down",18)}APERATION telepítése</button>
    <ol class="gsteps" id="gmanual">
      <li>Koppints a böngésző menüjére: ${vdots} (Chrome-ban jobb felül).</li>
      <li>Válaszd: <b>Alkalmazás telepítése</b> vagy <b>Hozzáadás a kezdőképernyőhöz</b>. Samsung Interneten: ☰ → Oldal hozzáadása → Kezdőképernyő.</li>
      <li>Erősítsd meg: <b>Telepítés</b>.</li>
      <li>Indítsd az appot a kezdőképernyőn vagy az alkalmazások között az <b>APERATION</b> ikonnal.</li></ol>`;
  return`<div class="gate-in"><div class="brand-logo" style="margin:0 auto 6px">${LOGO_SVG}</div>
    ${GJOIN?`<section class="card"><h2>Meghívtak egy közös diszpóba</h2><p class="muted">A meghívókódod:</p><p class="gcode num">${GJOIN}</p><p class="muted small">Jegyezd meg vagy másold ki. Telepítés után az appban: <b>Kezdés → Csatlakozás kóddal</b>, és írd be ezt a kódot.</p><button type="button" class="btn" id="gcode">Kód másolása</button></section>`:""}
    <section class="card"><h2>Tedd ki a főképernyőre</h2>
      <p class="muted">Az APERATION telefonon csak a főképernyőről indítva működik. Így <b>net nélkül is</b> fut a forgatáson, teljes képernyős, nem alszik el, és a terved biztonságban az appban marad.</p>
      ${steps}<p class="gdone" id="gdone" hidden>${ic("check",18)}Kész! Most indítsd az appot a főképernyőről.</p></section>
    ${creditLine()}</div>`;
}
function gateShow(){
  const g=document.createElement("div");g.className="gate";g.id="gate";g.setAttribute("role","dialog");g.setAttribute("aria-modal","true");g.setAttribute("aria-label","Telepítés a főképernyőre");
  g.innerHTML=gateHTML();document.body.append(g);document.documentElement.classList.add("gated");
  const c=g.querySelector("#gcopy");c&&(c.onclick=()=>copyText(location.origin+location.pathname+(GJOIN?"?join="+GJOIN:"")));
  const gc=g.querySelector("#gcode");gc&&(gc.onclick=()=>copyText(GJOIN));
  const ib=g.querySelector("#ginstall");
  const offer=()=>{if(ib&&installEvt){ib.hidden=false}};
  offer();addEventListener("gate-prompt",offer);
  ib&&(ib.onclick=async()=>{if(!installEvt)return;installEvt.prompt();try{const r=await installEvt.userChoice;if(r.outcome==="accepted"){g.querySelector("#gdone").hidden=false;ib.hidden=true}}catch(e){}installEvt=null});
  addEventListener("appinstalled",()=>{const d=g.querySelector("#gdone");d&&(d.hidden=false);ib&&(ib.hidden=true)});
}
addEventListener("beforeinstallprompt",e=>{if(!GATED)return;e.preventDefault();installEvt=e;dispatchEvent(new Event("gate-prompt"))});

addEventListener("keydown",e=>{
  if(tour||e.metaKey||e.ctrlKey||e.altKey||view!=="most"||!B.length||!$("#viewer").hidden)return;

route(false);
setInterval(()=>tick(false),250);
setTimeout(()=>{let seen=true;try{seen=!!localStorage.getItem(TOUR_KEY)}catch(e){}if(!seen&&!GATED&&!(isShootDay()&&st.cur)){if(authNeeded())TOUR_AFTER_AUTH=true;else tourStart()}},600);
</script>
